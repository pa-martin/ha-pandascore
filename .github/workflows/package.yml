name: "Package"

on:
  release:
    types:
      - "published"

permissions:
  contents: write

jobs:
  package:
    name: "Package integration"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout the release"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: "Create ZIP archive"
        run: |
          cd custom_components/pandascore
          zip -r "${{ github.workspace }}/ha_pandascore.zip" ./

      - name: "Upload ZIP to release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "${{ github.workspace }}/ha_pandascore.zip" \
            --clobber
