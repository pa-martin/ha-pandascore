name: "Package"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: "Package integration"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout the release"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: "Create ZIP archive"
        run: |
          cd custom_components/pandascore
          zip -r "${{ github.workspace }}/ha_pandascore.zip" ./

      - name: "Upload ZIP to release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ha_pandascore.zip
