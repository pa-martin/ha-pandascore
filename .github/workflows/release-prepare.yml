name: "Prepare release"

on:
  push:
    branches:
      - "main"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: "Prepare release"
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(') }}
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: "Determine next version"
        id: version
        run: python3 scripts/release.py

      - name: "Stop if no release is required"
        if: steps.version.outputs.release != 'true'
        run: echo "No release required."

      - name: "Configure Git"
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: "Create release branch"
        if: steps.version.outputs.release == 'true'
        run: |
          git checkout -b "release/v${{ steps.version.outputs.version }}"

      - name: "Commit version change"
        if: steps.version.outputs.release == 'true'
        run: |
          git add custom_components/pandascore/manifest.json
          git commit \
            -m "chore(release): v${{ steps.version.outputs.version }}"

      - name: "Push release branch"
        if: steps.version.outputs.release == 'true'
        run: |
          git push origin \
            "release/v${{ steps.version.outputs.version }}"

      - name: "Create release pull request"
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "release/v${{ steps.version.outputs.version }}" \
            --title "chore(release): v${{ steps.version.outputs.version }}" \
            --body "Automated release preparation for version \`v${{ steps.version.outputs.version }}\`."
